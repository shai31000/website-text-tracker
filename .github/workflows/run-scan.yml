name: Run website scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- התקנת Puppeteer וה-dependencies שלו ---
      - name: Install dependencies
        run: |
          npm install puppeteer

      - name: Run scan script
        run: node src/scan.js

      - name: Commit and push changes
  run: |
    git config user.name "github-actions"
    git config user.email "github-actions@github.com"

    echo "Git status before add:"
    git status

    git add data/snapshots.json data/titles.txt

    echo "Git status after add:"
    git status

    git diff --cached || true

    git diff --cached --quiet || git commit -m "Update snapshots and titles"

    git push

