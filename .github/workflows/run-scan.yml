# שם הפעולה – זה מה שתראה בלשונית Actions
name: Run website scan

# מתי הפעולה תרוץ
on:
  # מאפשר לנו להפעיל ידנית (כפתור Run)
  workflow_dispatch:

  # הרצה אוטומטית כל שעה
  schedule:
    - cron: "0 * * * *"

# מה בדיוק GitHub צריך לעשות
jobs:
  scan:
    # סוג המחשב הווירטואלי
    runs-on: ubuntu-latest

    steps:
      # שלב 1: הורדת הקוד שלנו למחשב של GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # שלב 2: התקנת Node.js (כדי להריץ JavaScript)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # שלב 3: הרצת קובץ הסריקה שלנו
      - name: Run scan script
        run: node src/scan.js
